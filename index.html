<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor KML Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1a73e8; --text:#202124; --muted:#5f6368; --line:#dadce0; --hover:#f1f3f4;
  --surface:#f6f7f9; --card:#fff; --dashH:50vh;
  --ink2:#52514e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--text);font:14px/1.35 Roboto,Arial,sans-serif}
button{font:inherit;color:inherit}
input,select{font:inherit}

/* ---------- mapa ---------- */
#mapWrap{position:absolute;left:0;right:0;top:0;bottom:0;transition:bottom .25s ease}
body.dash-open #mapWrap{bottom:var(--dashH)}
body.dragging #mapWrap,body.dragging #dash{transition:none}
#map{position:absolute;inset:0;background:#e9e7e1}

/* ---------- panel de capas estilo My Maps ---------- */
#panel{position:absolute;top:12px;left:12px;width:310px;max-height:calc(100% - 24px);background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.3);border-radius:2px;z-index:1000;display:flex;flex-direction:column}
#panel.collapsed #panelBody{display:none}
.phead{padding:14px 12px 10px 16px;display:flex;gap:6px;align-items:flex-start}
.phead .t{flex:1;min-width:0}
#mapTitle{font-size:16px;font-weight:500;outline:none;border-bottom:1px solid transparent;word-break:break-word}
#mapTitle:focus{border-bottom-color:var(--blue)}
#mapSub{font-size:12px;color:var(--muted);margin-top:4px}
.pactions{display:flex;flex-wrap:wrap;gap:2px 10px;padding:6px 12px 8px;background:#f1f3f4;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lnk{background:none;border:0;padding:5px 4px;cursor:pointer;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:6px;border-radius:3px}
.lnk:hover{background:#e3e5e8}
.lnk svg{width:18px;height:18px;fill:var(--muted)}
#panelBody{display:flex;flex-direction:column;min-height:0;flex:1}
#layers{overflow:auto;flex:1;min-height:60px}
.empty{padding:22px 18px;color:var(--muted);font-size:13px;text-align:center}
.empty b{color:var(--text)}
.layer{border-bottom:1px solid var(--line);padding:6px 0 8px}
.lhead{display:flex;align-items:center;gap:6px;padding:4px 6px 2px 12px}
.lhead input{margin:0;width:16px;height:16px;accent-color:#3c4043;flex:none}
.lname{flex:1;font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
.lcount{font-size:12px;color:var(--muted);font-weight:400;text-transform:none}
.ibtn{background:none;border:0;cursor:pointer;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.ibtn:hover{background:var(--hover)}
.ibtn svg{width:18px;height:18px;fill:currentColor}
.lsub{padding:0 12px 2px 34px;display:flex;align-items:center;gap:6px}
.lsub svg{width:14px;height:14px;fill:var(--blue);flex:none}
.stylesel{border:0;background:none;color:var(--blue);font-size:12px;padding:3px 0;cursor:pointer;max-width:230px;outline:none}
.stylesel:hover{text-decoration:underline}
.cats{padding:2px 8px 0 30px;max-height:260px;overflow:auto}
.cat{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:3px;font-size:12.5px}
.cat:hover{background:var(--hover)}
.cat input{margin:0;width:14px;height:14px;accent-color:#3c4043;flex:none}
.cat .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.cat .n{color:var(--muted);font-size:12px}
.sw{border:0;background:none;padding:2px;cursor:pointer;border-radius:3px;display:inline-flex;flex:none;line-height:0}
.sw:hover{background:#e3e5e8}
.pfoot{border-top:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.pfoot select{flex:1;border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:#fff}

/* ---------- buscador ---------- */
#search{position:absolute;top:12px;left:334px;z-index:1000;display:flex;box-shadow:0 1px 4px rgba(0,0,0,.3);border-radius:2px;background:#fff}
#search input{border:0;outline:0;padding:0 12px;width:270px;height:34px;font-size:14px;border-radius:2px 0 0 2px}
#search button{border:0;background:var(--blue);width:48px;cursor:pointer;border-radius:0 2px 2px 0;display:flex;align-items:center;justify-content:center}
#search button svg{width:18px;height:18px;fill:#fff}
#searchRes{position:absolute;top:36px;left:0;right:0;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);max-height:340px;overflow:auto;display:none}
#searchRes .sh{font-size:11px;color:var(--muted);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.4px}
#searchRes .si{padding:7px 12px;cursor:pointer;font-size:13px;border-top:1px solid #f1f3f4}
#searchRes .si:hover{background:var(--hover)}
#searchRes .si small{display:block;color:var(--muted);font-size:11.5px}

/* ---------- botón dashboard ---------- */
#dashBtn{position:absolute;top:12px;right:12px;z-index:1000;border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);
  border-radius:20px;padding:0 16px 0 12px;height:38px;display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer;color:var(--text)}
#dashBtn:hover{background:#f8f9fa}
#dashBtn svg{width:20px;height:20px;fill:var(--blue)}
body.dash-open #dashBtn{background:var(--blue);color:#fff}
body.dash-open #dashBtn svg{fill:#fff}

/* ---------- marcadores / etiquetas ---------- */
.mk{background:none;border:0}
.mk svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.plabel{background:transparent;border:0;box-shadow:none;font-weight:700;font-size:11px;color:#202124;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;padding:0}
.plabel:before{display:none}
.leaflet-popup-content-wrapper{border-radius:8px}
.leaflet-popup-content{margin:12px 14px;font:13px/1.4 Roboto,Arial,sans-serif;max-height:340px;overflow:auto}
.pp-t{font-size:15px;font-weight:500;margin-bottom:2px}
.pp-l{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.pp table{border-collapse:collapse;width:100%}
.pp td{padding:3px 0;vertical-align:top;border-top:1px solid #f1f3f4}
.pp td:first-child{color:var(--muted);padding-right:10px;white-space:nowrap;font-size:12px}
.pp img{max-width:100%;border-radius:4px;margin-top:6px}
.pp .desc{margin-top:8px;color:#3c4043;font-size:12.5px}
.pp .zbtn{margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer;font-size:12px;color:var(--blue)}
.pp .zbtn:hover{background:#e8f0fe}
.pp-f{display:flex;align-items:center;gap:2px;margin-top:10px;padding-top:8px;border-top:1px solid #f1f3f4;font-size:11.5px;color:var(--muted)}
.pp-f span{flex:1}
.pp-f button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pp-f button:hover{background:var(--hover)}
.pp-f button svg{width:19px;height:19px;fill:#5f6368}
.pp-f button.del:hover svg{fill:#c5221f}
.tact{background:none;border:0;color:#8ab4f8;font-weight:500;margin-left:16px;cursor:pointer;padding:0;font-size:13px;text-transform:uppercase}

/* ---------- popover genérico ---------- */
#pop{position:fixed;z-index:3000;background:#fff;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.25);display:none;min-width:200px;max-width:320px;max-height:70vh;overflow:auto}
.ph{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px}
.pgrid{display:grid;grid-template-columns:repeat(10,22px);gap:5px;padding:0 14px 6px}
.pgrid button{width:22px;height:22px;border-radius:50%;border:0;cursor:pointer;padding:0;position:relative}
.pgrid button.on:after{content:"";position:absolute;inset:-3px;border:2px solid #202124;border-radius:50%}
.gl{display:grid;grid-template-columns:repeat(8,30px);gap:4px;padding:0 14px 6px;max-height:210px;overflow:auto}
.gl button,.shp button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.gl button svg{width:18px;height:18px;fill:#3c4043}
.gl button.on,.shp button.on{border-color:var(--blue);background:#e8f0fe}
.shp{display:flex;gap:6px;padding:0 14px 6px}
.shp button{width:auto;padding:0 8px;font-size:12px;gap:4px}
.prow{display:flex;align-items:center;gap:10px;padding:4px 14px 8px;font-size:12.5px}
.prow input[type=range]{flex:1}
.prow input[type=color]{width:34px;height:24px;border:1px solid var(--line);padding:0;background:#fff;cursor:pointer}
.menu button{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 16px;cursor:pointer;font-size:13px;gap:10px;align-items:center}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:#c5221f}
.fl{padding:8px 12px}
.fl input[type=search],.fl input[type=text],.fl input[type=number],.fl input[type=date]{width:100%;border:1px solid var(--line);border-radius:4px;padding:6px 8px;outline:none}
.fl input:focus{border-color:var(--blue)}
.fl .bt{display:flex;gap:8px;margin:8px 0 4px}
.fl .bt button{border:0;background:none;color:var(--blue);cursor:pointer;font-size:12px;padding:2px 0}
.flist{max-height:300px;overflow:auto;margin:0 -4px}
.flist label{display:flex;align-items:center;gap:8px;padding:4px;border-radius:3px;cursor:pointer;font-size:12.5px}
.flist label:hover{background:var(--hover)}
.flist label span:not(.dot){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flist label em{font-style:normal;color:var(--muted);font-size:11.5px}
.flist input{accent-color:var(--blue);margin:0}
.fl .two{display:flex;gap:8px}
.fl .two div{flex:1}
.fl .two label{font-size:11px;color:var(--muted)}

/* ---------- dashboard ---------- */
#splitter{position:absolute;left:0;right:0;height:10px;bottom:calc(var(--dashH) - 5px);cursor:ns-resize;z-index:1500;display:none}
#splitter:after{content:"";position:absolute;left:50%;top:3px;width:44px;height:4px;margin-left:-22px;border-radius:2px;background:#bdc1c6}
body.dash-open #splitter{display:block}
#dash{position:absolute;left:0;right:0;bottom:0;height:var(--dashH);background:var(--surface);border-top:1px solid var(--line);
  transform:translateY(101%);transition:transform .25s ease;display:flex;flex-direction:column;z-index:1200}
body.dash-open #dash{transform:none}
.dtop{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px 8px}
.drow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dtitle{font-size:16px;font-weight:500;margin-right:6px}
.dmeta{font-size:12.5px;color:var(--muted);flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:4px;padding:5px 12px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;color:#3c4043}
.btn:hover{background:#f8f9fa}
.btn svg{width:16px;height:16px;fill:currentColor}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;max-height:76px;overflow:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;color:#3c4043}
.chip:hover{background:#f8f9fa}
.chip.on{background:#e8f0fe;border-color:#aecbfa;color:#174ea6;font-weight:500}
.chip.fixed{border-style:dashed}
.chip .cv{opacity:.7}
.chip svg{width:14px;height:14px;fill:currentColor}
.dbody{flex:1;overflow:auto;padding:12px 16px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{background:var(--card);border:1px solid #e6e7ea;border-radius:8px;padding:12px 14px;min-width:0}
.card.wide{grid-column:1/-1}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ch h3{margin:0;font-size:13.5px;font-weight:500;flex:1;min-width:120px}
.ch select{border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:12px;background:#fff;max-width:200px}
.ch .x{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid #e6e7ea;border-radius:8px;padding:10px 14px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:500;margin-top:2px;letter-spacing:-.3px}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;background:#eceae6;border-radius:3px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:#2a78d6;border-radius:3px}
.cwrap{position:relative;width:100%}
.nodata{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stats div{background:#f8f9fa;border-radius:6px;padding:6px 8px}
.stats b{display:block;font-size:15px;font-weight:500}
.stats span{font-size:11px;color:var(--muted)}
.tblbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tblbar input{border:1px solid var(--line);border-radius:4px;padding:5px 8px;width:220px;outline:none}
.tblbar .pg{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.twrap{overflow:auto;max-height:420px;border:1px solid #eceae6;border-radius:6px}
table.t{border-collapse:collapse;font-size:12px;width:100%}
table.t th{position:sticky;top:0;background:#f8f9fa;text-align:left;font-weight:500;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;color:#3c4043}
table.t td{padding:6px 10px;border-bottom:1px solid #f1f3f4;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:#f1f6fe}
.dot{flex:none;display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

/* ---------- varios ---------- */
#drop{position:fixed;inset:0;background:rgba(26,115,232,.12);border:3px dashed var(--blue);z-index:4000;display:none;align-items:center;justify-content:center;font-size:20px;color:#174ea6;font-weight:500;pointer-events:none}
body.dropping #drop{display:flex}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;z-index:5000;display:none;max-width:80vw}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:4500;display:none;align-items:center;justify-content:center;font-weight:500}
#loading.on{display:flex}
.leaflet-control-attribution{font-size:10px}

#splitter{touch-action:none}
@media (max-width:760px){
  #panel{top:8px;left:8px;width:calc(100% - 16px);max-height:55%}
  .phead{padding:10px 8px 8px 12px}
  #search{top:auto;bottom:16px;left:8px;right:8px}
  #search input{width:auto;flex:1;height:42px;font-size:16px}
  #searchRes{top:auto;bottom:44px}
  #dashBtn{top:auto;bottom:70px;right:8px;height:44px}
  body.dash-open #search,body.dash-open #panel{display:none}
  body.dash-open #dashBtn{bottom:auto;top:8px}
  .leaflet-control-zoom{display:none}
  .lhead input,.cat input{width:20px;height:20px}
  .cat{padding:5px 4px;font-size:13.5px}
  .ibtn{width:36px;height:36px}
  .dtop{padding:8px 10px 6px}
  .dmeta{flex-basis:100%;order:3}
  .drow .btn{padding:5px 8px;font-size:12px}
  .dtop{position:relative}
  #dashClose{position:absolute;right:4px;top:2px}
  .dtitle{margin-right:40px}
  .chips{flex-wrap:nowrap;overflow-x:auto;max-height:none;padding-bottom:4px}
  .dbody{padding:10px 8px 24px}
  .grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:22px}
  .tblbar input{width:100%}
  #pop{max-width:94vw}
  .flist label{padding:8px 4px;font-size:14px}
  #splitter{height:24px;bottom:calc(var(--dashH) - 12px)}
}
</style>
</head>
<body>

<div id="mapWrap">
  <div id="map"></div>

  <aside id="panel">
    <div class="phead">
      <div class="t">
        <div id="mapTitle" contenteditable="true" spellcheck="false">Mapa sin título</div>
        <div id="mapSub">Sin capas cargadas</div>
      </div>
      <button class="ibtn" id="collapseBtn" title="Contraer / expandir"><svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></button>
    </div>
    <div id="panelBody">
      <div class="pactions">
        <button class="lnk" id="addBtn"><svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg>Añadir capa (KML/KMZ)</button>
        <button class="lnk" id="fitAllBtn"><svg viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5c0-1.1-.9-2-2-2z"/></svg>Ver todo</button>
        <button class="lnk" id="newMapBtn" title="Quitar todas las capas y empezar de cero"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 14h-3v3h-2v-3H8v-2h3v-3h2v3h3v2zm-3-7V3.5L18.5 9H13z"/></svg>Nuevo mapa</button>
      </div>
      <div id="layers"></div>
      <div class="pfoot">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#5f6368"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
        Mapa base
        <select id="baseSel">
          <option value="voyager">CARTO Voyager</option>
          <option value="positron">CARTO Positron (claro)</option>
          <option value="dark">CARTO Dark Matter</option>
          <option value="sat">Satélite (Esri)</option>
          <option value="osm">OpenStreetMap</option>
        </select>
      </div>
    </div>
  </aside>

  <div id="search">
    <input id="searchIn" type="text" placeholder="Buscar en las capas o una dirección" autocomplete="off">
    <button id="searchBtn" title="Buscar"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
    <div id="searchRes"></div>
  </div>

  <button id="dashBtn"><svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg><span>Dashboard</span></button>
</div>

<div id="splitter" title="Arrastrar para cambiar el tamaño"></div>

<section id="dash">
  <div class="dtop">
    <div class="drow">
      <span class="dtitle">Dashboard</span>
      <span class="dmeta" id="dmeta"></span>
      <label class="btn" title="Contar solo lo que se ve en el mapa"><input type="checkbox" id="viewOnly" style="margin:0"> Solo vista del mapa</label>

/* =====================================================================
   Guardado automático en el navegador (IndexedDB): el mapa se recupera al recargar la página
   ===================================================================== */
const DB = {
  open() {
    return this._db || (this._db = new Promise((res, rej) => {
      const r = indexedDB.open('visor-kml-dashboard', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode), req = fn(t.objectStore('kv'));
      t.oncomplete = () => res(req && req.result);
      t.onerror = t.onabort = () => rej(t.error);
    });
  },
  get(k) { return this.run('readonly', st => st.get(k)); },
  set(k, v) { return this.run('readwrite', st => st.put(v, k)); },
  del(k) { return this.run('readwrite', st => st.delete(k)); },
  clear() { return this.run('readwrite', st => st.clear()); },
};
const removedUids = [];

let saveTimer = null, restoring = true, saving = Promise.resolve();
function snapshot(ly) {
  return {uid: ly.uid, name: ly.name, srcName: ly.srcName, file: ly.file, visible: ly.visible, analyzed: ly.analyzed,
    style: {...ly.style}, styleBy: ly.styleBy,
    cats: [...ly.cats].map(([v, c]) => [v, {color: c.color, glyph: c.glyph, visible: c.visible}])};
}
function scheduleSave() {
  if (restoring) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saving = saving.then(saveProject); }, 700);
}
async function saveProject() {
  try {
    for (const ly of S.layers) if (ly.dirty) {
      ly.dirty = false;
      await DB.set('feat:' + ly.uid, ly.features.map(f => ({type: 'Feature', geometry: f.geometry, properties: f.properties})));
    }
    await DB.set('meta', {v: 1, title: $('#mapTitle').textContent.trim(), base: $('#baseSel').value, layers: S.layers.map(snapshot)});
    while (removedUids.length) { const u = removedUids.pop(); if (!S.layers.some(l => l.uid === u)) await DB.del('feat:' + u); }
  } catch (e) {
    console.warn(e);
    toast('No se pudieron guardar los cambios en este navegador (¿modo incógnito o sin espacio?)', 6000);
  }
}
async function restoreProject() {
  let meta;
  try { meta = await DB.get('meta'); } catch (e) { console.warn(e); return; }
  if (meta?.title) $('#mapTitle').textContent = meta.title;
  if (meta?.base && BASES[meta.base] && meta.base !== $('#baseSel').value) { $('#baseSel').value = meta.base; $('#baseSel').onchange({target: $('#baseSel')}); }
  if (!meta?.layers?.length) return;
  const ld = $('#loading'); ld.textContent = 'Recuperando tu mapa…'; ld.classList.add('on');
  try {
    for (const m of meta.layers) {
      const feats = await DB.get('feat:' + m.uid);
      if (feats && feats.length) addLayer(m.srcName || m.name, feats, m.file, m);
    }
    afterLayersChange();
    fitLayers(S.layers.filter(l => l.visible));

  ld.classList.remove('on'); ld.textContent = 'Procesando archivo…';
}
async function newMap() {
  if (!confirm('¿Empezar un mapa nuevo? Se quitan todas las capas y los cambios guardados en este navegador.')) return;
  clearTimeout(saveTimer);

function fitLayers(lys) {
  const b = L.latLngBounds([]);
  for (const ly of lys) for (const f of ly.features) { const bb = bboxOf(f.geometry); if (isFinite(bb[0])) { b.extend([bb[1], bb[0]]); b.extend([bb[3], bb[2]]); } }
  if (b.isValid()) map.fitBounds(b, {paddingTopLeft: [innerWidth > 760 ? 330 : 10, 60], paddingBottomRight: [20, 20], maxZoom: 17});

/* =====================================================================
   Zonas (polígonos) — punto en polígono
   ===================================================================== */
function inRing(pt, ring) {
  let ins = false; const x = pt[0], y = pt[1];
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;
  }

}

  if (g.type === 'Polygon') return inRing(pt, g.coordinates[0]) && !g.coordinates.slice(1).some(h => inRing(pt, h));
  if (g.type === 'MultiPolygon') return g.coordinates.some(c => inPoly(pt, {type: 'Polygon', coordinates: c}));
  if (g.type === 'GeometryCollection') return g.geometries.some(x => inPoly(pt, x));
  return false;
}
function computeZones() {
  const seq = new Map();
  S.zones = S.feats.filter(f => f.kind === 'poly').map(f => {
    const n = (seq.get(f.ly) || 0) + 1; seq.set(f.ly, n);
    return {id: f.id, f, name: f.properties.name || `${f.ly.name} ${n}`, bb: bboxOf(f.geometry)};
  });
  S.zoneById = new Map(S.zones.map(z => [z.id, z]));
  for (const id of [...S.zoneSel]) if (!S.zoneById.has(id)) S.zoneSel.delete(id);
  for (const f of S.feats) {
    f.zones = [];
    if (!f.rep || f.kind === 'poly') continue;
    const p = f.rep;
    for (const z of S.zones) {
      if (p[0] < z.bb[0] || p[0] > z.bb[2] || p[1] < z.bb[1] || p[1] > z.bb[3]) continue;
      if (inPoly(p, z.f.geometry)) f.zones.push(z.id);

/* =====================================================================
   Columnas / filtros
   ===================================================================== */

    if (STYLE_KEYS.has(k)) continue;

  for (const e of m.values()) {

    let type;

    else if (numOk >= nonEmpty.length * .9 && nonEmpty.length > 15) type = 'num';
    else if (e.vals.size <= 150) type = 'cat';
    else type = 'text';
    const order = [...e.vals.keys()].sort((a, b) => e.vals.get(b) - e.vals.get(a));
    fields.push({key: e.key, type, uniq: e.vals.size, order, rank: new Map(order.map((v, i) => [v, i])), filled: e.filled});

  S.fieldMap = new Map(fields.map(f => [f.key, f]));
  for (const k of [...S.filters.keys()]) if (!S.fieldMap.has(k)) S.filters.delete(k);
  const cats = fields.filter(f => f.type === 'cat' && f.uniq >= 2);
  const styled = S.layers.find(l => l.analyzed && l.styleBy && S.fieldMap.has(l.styleBy))?.styleBy;
  const pref = cats.filter(f => f.uniq <= 25).sort((a, b) => score(b) - score(a));
  function score(f) { const r = f.filled / Math.max(1, src.length); return (r > .5 ? 200 : 0) + (/estado|status|tipo|categ|empresa|zona|barrio|comuna|situac/i.test(f.key) ? 100 : 0) + r * 50 - f.uniq / 1000; }

    <button data-a="up">Subir</button>
    <button data-a="del" class="danger">Quitar capa</button></div>`, p => {
    p.onclick = e => {
      const a = e.target.closest('button')?.dataset.a; if (!a) return;
      closePop();

      if (a === 'analyze') { ly.analyzed = !ly.analyzed; computeFields(); renderPanel(); refresh(); }
      if (a === 'export') download(ly.name + '.kml', buildKml(ly.features, ly.name), 'application/vnd.google-earth.kml+xml');
      if (a === 'up') { const i = S.layers.indexOf(ly); if (i > 0) { S.layers.splice(i, 1); S.layers.splice(i - 1, 0, ly); renderPanel(); } }
      if (a === 'del' && confirm(`¿Quitar la capa “${ly.name}” del mapa?`)) removeLayer(ly);
    };

}

function sanitize(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,iframe,object,embed,form').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => { if (/^on/i.test(a.name) || /javascript:/i.test(a.value)) n.removeAttribute(a.name); }));
  return doc.body.innerHTML;
}
function valHtml(v) {
  const s = String(v ?? '');
  if (/^https?:\/\/\S+\.(jpe?g|png|gif|webp)(\?\S*)?$/i.test(s)) return `<img src="${esc(s)}" loading="lazy">`;
  if (/^https?:\/\/\S+$/i.test(s)) return `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s.length > 40 ? s.slice(0, 40) + '…' : s)}</a>`;
  return esc(s);
}
function popupHtml(f) {
  const p = f.properties;
  const rows = Object.keys(p).filter(k => !STYLE_KEYS.has(k) && String(p[k] ?? '').trim() !== '')
    .map(k => `<tr><td>${esc(k)}</td><td>${valHtml(p[k])}</td></tr>`).join('');
  const media = String(p.gx_media_links || '').split(/\s+/).filter(Boolean).map(u => `<img src="${esc(u)}" loading="lazy">`).join('');
  const desc = p.description && !p.__desc_parsed ? `<div class="desc">${sanitize(p.description)}</div>` : '';
  const zbtn = f.kind === 'poly' ? `<button class="zbtn" onclick="App.zoneFromPopup(${f.id})">${S.zoneSel.has(f.id) ? 'Quitar filtro de esta zona' : 'Filtrar dashboard por esta zona'}</button>` : '';
  const zs = f.zones && f.zones.length ? `<div class="pp-l">Zona: ${f.zones.map(z => esc(S.zoneById.get(z)?.name)).join(', ')}</div>` : '';
  // que el globo quede arriba del pin y no lo tape
  const pop = f._lyr.getPopup();
  if (pop) {
    const ic = f.kind === 'point' ? iconFor(featStyle(f)) : null;
    pop.options.offset = L.point(0, ic ? -(ic.ay - 3) : 7);
    // se calcula al abrir (al cargar la página el ancho de la ventana puede valer 0)
    pop.options.maxWidth = Math.max(240, Math.min(360, innerWidth - 40));
    pop.options.minWidth = Math.min(240, innerWidth - 60);
    pop.options.autoPanPaddingTopLeft = innerWidth > 760 ? L.point(330, 60) : L.point(10, 70);
  }
  const coord = f.rep ? `${f.rep[1].toFixed(5)}, ${f.rep[0].toFixed(5)}` : '';
  return `<div class="pp"><div class="pp-t">${esc(p.name || '(sin nombre)')}</div><div class="pp-l">${esc(f.ly.name)}</div>${zs}
    ${rows ? `<table>${rows}</table>` : ''}${media}${desc}${zbtn}
    <div class="pp-f"><span>📍 ${coord}</span>
      <button title="Acercar" onclick="App.zoomTo(${f.id})"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm.5-7H9v2H7v1h2v2h1v-2h2V9h-2z"/></svg></button>
      <button title="Eliminar lugar" class="del" onclick="App.deleteFeature(${f.id})"><svg viewBox="0 0 24 24"><path d="${GLYPHS.trash}"/></svg></button>
    </div></div>`;
}
let lastDeleted = null;
function deleteFeature(f) {
  const ly = f.ly;
  map.closePopup();
  if (f._shown) ly.group.removeLayer(f._lyr);
  f._shown = false;
  lastDeleted = {f, ly, idxL: ly.features.indexOf(f), idxS: S.feats.indexOf(f)};
  ly.features.splice(lastDeleted.idxL, 1);
  S.feats.splice(lastDeleted.idxS, 1);
  recountLayer(ly);
  ly.dirty = true;
  if (!ly.features.length) { map.removeLayer(ly.group); S.layers = S.layers.filter(l => l !== ly); removedUids.push(ly.uid); }
  afterLayersChange();
  toast(`Se eliminó “${f.properties.name || 'el elemento'}”`, 7000, {label: 'Deshacer', fn: undoDelete});
}
function undoDelete() {
  const d = lastDeleted; if (!d) return;
  lastDeleted = null;
  if (!S.layers.includes(d.ly)) { S.layers.push(d.ly); d.ly.group.addTo(map); }
  d.ly.features.splice(d.idxL, 0, d.f);
  S.feats.splice(d.idxS, 0, d.f);
  recountLayer(d.ly);
  d.ly.dirty = true;
  afterLayersChange();
  toast('Elemento restaurado');
}
function recountLayer(ly) {
  ly.counts = {point: 0, line: 0, poly: 0};
  for (const f of ly.features) ly.counts[f.kind]++;
  if (ly.styleBy && ly.styleBy !== '__kml') {
    for (const c of ly.cats.values()) c.n = 0;
    for (const f of ly.features) { const c = ly.cats.get(catVal(f.properties[ly.styleBy])); if (c) c.n++; }
  }
}
window.App = {
  zoneFromPopup(id) { toggleZone(id); map.closePopup(); if (!dashOpen) openDash(true); toast(S.zoneSel.has(id) ? 'Filtro de zona aplicado' : 'Filtro de zona quitado'); },
  zoomTo(id) { const f = S.feats.find(x => x.id === id); if (f) focusFeature(f); },
  deleteFeature(id) { const f = S.feats.find(x => x.id === id); if (f) deleteFeature(f); },
};
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && lastDeleted && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) { e.preventDefault(); undoDelete(); } });

Chart.register({

Chart.register({

});
const charts = {};
function mkChart(id, cfg) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  const cv = document.getElementById(id); if (!cv) return;
  charts[id] = new Chart(cv, cfg);
}

function fieldLabel(k) { return k === '__layer' ? 'Capa' : k; }
function colorFor(k, v) {
  if (v === '__other') return OTHER;
  if (k === '__layer') { const ly = S.layers.find(l => l.name === v); return ly ? (ly.styleBy === '__kml' ? ly.style.color : ly.style.color) : OTHER; }
  const ly = S.layers.find(l => l.analyzed && l.styleBy === k && l.cats.has(v));
  if (ly) return ly.cats.get(v).color;
  const fd = S.fieldMap.get(k); const r = fd ? fd.rank.get(v) : null;
  return r != null && r < VIZ.length ? VIZ[r] : OTHER;
}
const hasKey = (f, k) => k === '__layer' || f.ly.keys.has(k);
function countBy(fs, k) {
  const m = new Map();
  for (const f of fs) {
    if (!hasKey(f, k)) continue; const v = getVal(f, k); m.set(v, (m.get(v) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function topN(entries, n) {
  if (entries.length <= n) return entries;
  const rest = entries.slice(n - 1).reduce((a, e) => a + e[1], 0);
  return entries.slice(0, n - 1).concat([[`Otros (${entries.length - n + 1})`, rest, true]]);
}
function fieldOptions(sel, types = ['cat'], extra = true) {
  const o = [];
  if (extra && S.layers.filter(l => l.analyzed).length) o.push(`<option value="__layer" ${sel === '__layer' ? 'selected' : ''}>Capa</option>`);
  for (const f of S.fields) if (types.includes(f.type) && (f.type !== 'cat' || f.uniq >= 1))
    o.push(`<option value="${esc(f.key)}" ${sel === f.key ? 'selected' : ''}>${esc(f.key)}</option>`);
  return o.join('');
}
function hbar(id, entries, k, total, clickable) {
  const labels = entries.map(e => e[0]), data = entries.map(e => e[1]);

  mkChart(id, {

    options: {

        y: {grid: {display: false}, border: {display: false}, ticks: {autoSkip: false, callback(v) { const l = this.getLabelForValue(v); return l.length > 26 ? l.slice(0, 25) + '…' : l; }}},
      },

function renderDash() {

  // posiciones de scroll para no saltar al re-renderizar
  const sc = body.scrollTop;
  const dist = S.dist, distE = dist ? countBy(fs, dist) : [];
  const top = distE[0];
  const hasZones = S.zones.length > 0 && all.some(f => f.zones && f.zones.length);
  const dateF = S.dateField ? S.fieldMap.get(S.dateField) : null;
  const numF = S.numField ? S.fieldMap.get(S.numField) : null;
  const lyCount = new Set(fs.map(f => f.ly.id)).size;

  body.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="k">Registros filtrados</div><div class="v">${fmt(fs.length)}</div>
        <div class="s">de ${fmt(all.length)} en total</div><div class="meter"><i style="width:${all.length ? fs.length / all.length * 100 : 0}%"></i></div></div>
      <div class="kpi"><div class="k">Porcentaje del total</div><div class="v">${pctS(fs.length, all.length)}</div><div class="s">${nFilt ? nFilt + ' filtro(s) aplicados' : 'Sin filtros'}</div></div>
      <div class="kpi"><div class="k">Capas con datos</div><div class="v">${lyCount}</div><div class="s">${S.layers.filter(l => l.analyzed).length} incluidas en estadísticas</div></div>
      ${dist && top ? `<div class="kpi"><div class="k">Valor más frecuente · ${esc(fieldLabel(dist))}</div><div class="v" style="font-size:18px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(top[0])}">${esc(top[0])}</div><div class="s">${fmt(top[1])} registros · ${pctS(top[1], fs.length)}</div></div>` : ''}
      ${hasZones ? `<div class="kpi"><div class="k">Dentro de zonas</div><div class="v">${fmt(fs.filter(f => f.zones.length).length)}</div><div class="s">${pctS(fs.filter(f => f.zones.length).length, fs.length)} de lo filtrado</div></div>` : ''}
    </div>
    <div class="grid" style="margin-top:12px">
      <div class="card"><div class="ch"><h3>Cantidad por</h3><select id="selDist">${fieldOptions(dist)}</select><span class="x">clic en una barra = filtrar</span></div><div class="cwrap"><canvas id="cDist"></canvas></div></div>
      <div class="card"><div class="ch"><h3>Porcentaje · ${esc(fieldLabel(dist || ''))}</h3></div><div class="cwrap" style="height:260px"><canvas id="cPie"></canvas></div></div>

      <div class="card"><div class="ch"><h3>Cruce</h3><select id="selA">${fieldOptions(S.crossA)}</select><span class="x">por</span><select id="selB">${fieldOptions(S.crossB)}</select></div><div class="cwrap"><canvas id="cCross"></canvas></div></div>
      ${dateF ? `<div class="card"><div class="ch"><h3>Evolución en el tiempo</h3><select id="selDate">${fieldOptions(S.dateField, ['date'], false)}</select></div><div class="cwrap" style="height:220px"><canvas id="cTime"></canvas></div></div>` : ''}
      ${numF ? `<div class="card"><div class="ch"><h3>Columna numérica</h3><select id="selNum">${fieldOptions(S.numField, ['num'], false)}</select></div><div id="numStats"></div><div class="cwrap" style="height:170px"><canvas id="cNum"></canvas></div></div>` : ''}
      <div class="card wide"><div class="ch"><h3>Registros</h3></div>
        <div class="tblbar"><input type="search" id="tblQ" placeholder="Buscar en la tabla…" value="${esc(S.tableQ)}"><div class="pg" id="pg"></div></div>

  body.scrollTop = sc;

  // --- distribución + torta

      options: {

          tooltip: {callbacks: {label: c => ` ${c.label}: ${fmt(c.raw)} (${pctS(c.raw, fs.length)})`}},

function renderCross(fs) {
  const A = S.crossA, B = S.crossB;
  if (!A || !B) { $('#cCross').parentNode.innerHTML = '<div class="nodata">Elegí dos columnas.</div>'; return; }
  const aE = topN(countBy(fs, A), 10);
  const aKeys = aE.map(e => e[0]), aOther = new Set(countBy(fs, A).slice(9).map(e => e[0]));
  const isOtherA = v => aE.length === 10 && aOther.has(v) && aE[9][2];
  const bAll = countBy(fs, B);
  const bKeys = bAll.slice(0, bAll.length > 7 ? 6 : 7).map(e => e[0]);
  const hasOtherB = bAll.length > 7;
  const idxA = new Map(aKeys.map((k, i) => [k, i]));
  const mat = new Map(bKeys.map(k => [k, new Array(aKeys.length).fill(0)]));
  if (hasOtherB) mat.set('__other', new Array(aKeys.length).fill(0));
  for (const f of fs) {
    if (!hasKey(f, A) || !hasKey(f, B)) continue;
    let a = getVal(f, A); if (isOtherA(a)) a = aKeys[9];
    const ai = idxA.get(a); if (ai == null) continue;
    let b = getVal(f, B); if (!mat.has(b)) b = '__other';
    mat.get(b)[ai]++;
  }
  // colores: orden fijo por frecuencia global (no por lo filtrado) para que no cambien al filtrar
  const bCol = k => {
    if (k === '__other') return OTHER;
    const ly = S.layers.find(l => l.analyzed && l.styleBy === B && l.cats.has(k));
    if (ly || B === '__layer') return colorFor(B, k);
    const fd = S.fieldMap.get(B), r = fd ? fd.rank.get(k) : null;
    return r != null && r < VIZ.length ? VIZ[r] : VIZ[bKeys.indexOf(k) % VIZ.length];
  };
  const datasets = [...mat.entries()].map(([k, arr]) => ({
    label: k === '__other' ? `Otros (${bAll.length - bKeys.length})` : k, data: arr, backgroundColor: bCol(k),
    borderColor: '#fff', borderWidth: {left: 0, right: 2, top: 0, bottom: 0}, borderSkipped: false, maxBarThickness: 18,
  }));
  $('#cCross').parentNode.style.height = Math.max(160, aKeys.length * 28 + 70) + 'px';
  mkChart('cCross', {
    type: 'bar', data: {labels: aKeys, datasets},
    options: {
      indexAxis: 'y', maintainAspectRatio: false,
      scales: {x: {stacked: true, beginAtZero: true, grid: {color: '#f0efec'}, border: {display: false}, ticks: {precision: 0, maxTicksLimit: 6}},
               y: {stacked: true, grid: {display: false}, border: {display: false}, ticks: {autoSkip: false, callback(v) { const l = this.getLabelForValue(v); return l.length > 22 ? l.slice(0, 21) + '…' : l; }}}},
      plugins: {
        legend: {position: 'bottom', labels: {boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'circle', padding: 12,
          generateLabels: ch => Chart.defaults.plugins.legend.labels.generateLabels(ch).map(l => ({...l, text: l.text.length > 24 ? l.text.slice(0, 23) + '…' : l.text}))}},
        tooltip: {mode: 'index', axis: 'y', callbacks: {
          label: c => c.raw ? ` ${c.dataset.label}: ${fmt(c.raw)} (${pctS(c.raw, c.chart.data.datasets.reduce((a, d) => a + d.data[c.dataIndex], 0))})` : null}},
      },
    }
  });
}

function renderTime(fs) {
  const k = S.dateField; const ds = fs.map(f => parseDate(f.properties[k])).filter(Boolean);
  if (!ds.length) { $('#cTime').parentNode.innerHTML = '<div class="nodata">Sin fechas en lo filtrado.</div>'; return; }
  const min = Math.min(...ds.map(d => +d)), max = Math.max(...ds.map(d => +d));
  const byDay = (max - min) / 864e5 <= 62;
  const key = d => byDay ? d.toISOString().slice(0, 10) : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  const m = new Map();
  // completar huecos
  const cur = new Date(min); cur.setHours(0, 0, 0, 0); if (!byDay) cur.setDate(1);
  let guard = 0;
  while (+cur <= max && guard++ < 400) { m.set(key(cur), 0); byDay ? cur.setDate(cur.getDate() + 1) : cur.setMonth(cur.getMonth() + 1); }
  for (const d of ds) m.set(key(d), (m.get(key(d)) || 0) + 1);
  const keys = [...m.keys()].sort();
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const lab = s => byDay ? s.slice(8, 10) + '/' + s.slice(5, 7) : MES[+s.slice(5, 7) - 1] + ' ' + s.slice(2, 4);
  mkChart('cTime', {
    type: 'bar',
    data: {labels: keys.map(lab), datasets: [{data: keys.map(k2 => m.get(k2)), backgroundColor: '#2a78d6', borderRadius: 4, borderSkipped: 'start', maxBarThickness: 28}]},
    options: {maintainAspectRatio: false, layout: {padding: {top: 16}},
      scales: {x: {grid: {display: false}, border: {display: false}, ticks: {maxRotation: 0, autoSkip: true}}, y: {beginAtZero: true, grid: {color: '#f0efec'}, border: {display: false}, ticks: {precision: 0, maxTicksLimit: 5}}},
      plugins: {legend: {display: false}, barLabels: {show: keys.length <= 24}, tooltip: {callbacks: {label: c => ` ${fmt(c.raw)} registros`}}}}
  });
}

function renderNum(fs) {
  const k = S.numField;
  const vs = fs.map(f => parseNum(f.properties[k])).filter(n => !isNaN(n)).sort((a, b) => a - b);
  if (!vs.length) { $('#numStats').innerHTML = '<div class="nodata">Sin valores numéricos en lo filtrado.</div>'; $('#cNum').parentNode.style.display = 'none'; return; }
  const sum = vs.reduce((a, b) => a + b, 0), med = vs.length % 2 ? vs[(vs.length - 1) / 2] : (vs[vs.length / 2 - 1] + vs[vs.length / 2]) / 2;
  $('#numStats').innerHTML = `<div class="stats">
    <div><b>${fmt(sum)}</b><span>Suma</span></div><div><b>${fmt(sum / vs.length)}</b><span>Promedio</span></div><div><b>${fmt(med)}</b><span>Mediana</span></div>
    <div><b>${fmt(vs[0])}</b><span>Mínimo</span></div><div><b>${fmt(vs[vs.length - 1])}</b><span>Máximo</span></div><div><b>${fmt(vs.length)}</b><span>Con valor</span></div></div>`;
  const bins = 12, lo = vs[0], hi = vs[vs.length - 1], w = (hi - lo) / bins || 1;
  const cnt = new Array(bins).fill(0);
  for (const v of vs) cnt[Math.min(bins - 1, Math.floor((v - lo) / w))]++;
  mkChart('cNum', {
    type: 'bar',
    data: {labels: cnt.map((_, i) => `${fmt(lo + i * w)} – ${fmt(lo + (i + 1) * w)}`), datasets: [{data: cnt, backgroundColor: '#2a78d6', borderRadius: 3, borderSkipped: 'start', categoryPercentage: 1, barPercentage: .92}]},
    options: {maintainAspectRatio: false, scales: {x: {grid: {display: false}, border: {display: false}, ticks: {display: false}}, y: {beginAtZero: true, grid: {color: '#f0efec'}, border: {display: false}, ticks: {precision: 0, maxTicksLimit: 4}}},
      plugins: {legend: {display: false}, tooltip: {callbacks: {title: c => c[0].label, label: c => ` ${fmt(c.raw)} registros`}}}}
  });
}

function renderTable(fs) {
  const q = norm(S.tableQ);
  let rows = q ? fs.filter(f => norm(f.properties.name).includes(q) || norm(f.ly.name).includes(q) || S.fields.some(fd => norm(f.properties[fd.key]).includes(q))) : fs.slice();
  const cols = S.fields.filter(fd => fd.key !== 'name').slice(0, 20).map(fd => fd.key);
  const hasName = fs.some(f => f.properties.name);
  if (S.sortKey) {
    const k = S.sortKey, d = S.sortDir;
    const get = f => k === '__layer' ? f.ly.name : k === 'name' ? (f.properties.name || '') : (f.properties[k] ?? '');
    rows.sort((a, b) => { const x = get(a), y = get(b), nx = parseNum(x), ny = parseNum(y);
      return (!isNaN(nx) && !isNaN(ny) ? nx - ny : String(x).localeCompare(String(y), 'es')) * d; });
  }
  const per = 50, pages = Math.max(1, Math.ceil(rows.length / per));
  S.page = Math.min(S.page, pages - 1);
  const slice = rows.slice(S.page * per, S.page * per + per);
  const arrow = k => S.sortKey === k ? (S.sortDir > 0 ? ' ▲' : ' ▼') : '';
  const head = `<th data-k="__layer">Capa${arrow('__layer')}</th>` + (hasName ? `<th data-k="name">Nombre${arrow('name')}</th>` : '') + cols.map(c => `<th data-k="${esc(c)}">${esc(c)}${arrow(c)}</th>`).join('');
  const body = slice.map(f => {
    const st = featStyle(f);
    return `<tr data-f="${f.id}"><td><span class="dot" style="background:${st.color}"></span>${esc(f.ly.name)}</td>` +
      (hasName ? `<td>${esc(f.properties.name || '')}</td>` : '') + cols.map(c => `<td title="${esc(f.properties[c])}">${esc(f.properties[c] ?? '')}</td>`).join('') + '</tr>';
  }).join('');
  $('#twrap').innerHTML = `<table class="t"><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length + 2}" style="color:#5f6368">Sin resultados</td></tr>`}</tbody></table>`;
  $('#pg').innerHTML = `${fmt(rows.length)} filas · pág. ${S.page + 1}/${pages} <button class="btn" id="pgPrev" ${S.page ? '' : 'disabled'}>‹</button><button class="btn" id="pgNext" ${S.page < pages - 1 ? '' : 'disabled'}>›</button>`;
  $('#pgPrev').onclick = () => { S.page--; renderTable(fs); };
  $('#pgNext').onclick = () => { S.page++; renderTable(fs); };
  $('#twrap thead').onclick = e => { const k = e.target.closest('th')?.dataset.k; if (!k) return; S.sortDir = S.sortKey === k ? -S.sortDir : 1; S.sortKey = k; renderTable(fs); };
  $('#twrap tbody').onclick = e => { const id = +e.target.closest('tr')?.dataset.f; const f = S.feats.find(x => x.id === id); if (f) focusFeature(f); };
}
function focusFeature(f) {
  const bb = bboxOf(f.geometry);
  if (f.kind === 'point') map.setView([f.rep[1], f.rep[0]], Math.max(map.getZoom(), 17));
  else map.fitBounds([[bb[1], bb[0]], [bb[3], bb[2]]], {maxZoom: 18, padding: [30, 30]});
  setTimeout(() => { if (!f._shown) toast('Ese elemento está oculto por los filtros del mapa'); else { let l; leaves(f._lyr, x => l = l || x); f._lyr.openPopup(l.getLatLng ? l.getLatLng() : L.latLng(f.rep[1], f.rep[0])); } }, 350);
}

/* ---------- chips de filtro ---------- */
const CHIP_SVG = '<svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>';
function renderChips() {
  const out = [];
  const an = S.layers.filter(l => l.analyzed).length;
  const excl = S.layers.some(l => !l.analyzed && (l.counts.point || l.counts.line));
  out.push(`<button class="chip fixed ${excl ? 'on' : ''}" data-chip="__layers">Capas <span class="cv">${an}/${S.layers.length}</span>${CHIP_SVG}</button>`);
  if (S.zones.length) out.push(`<button class="chip fixed ${S.zoneSel.size ? 'on' : ''}" data-chip="__zones">Zona${S.zoneSel.size ? ` <span class="cv">(${S.zoneSel.size})</span>` : ''}${CHIP_SVG}</button>`);
  const ordered = [...S.fields].sort((a, b) => (S.filters.has(b.key) - S.filters.has(a.key)) || ({cat: 0, date: 1, num: 2, text: 3}[a.type] - {cat: 0, date: 1, num: 2, text: 3}[b.type]) || a.uniq - b.uniq);
  for (const fd of ordered) {
    const fl = S.filters.get(fd.key);
    let cv = '';
    if (fl?.type === 'cat') cv = fl.sel.size === 1 ? `: ${[...fl.sel][0]}` : ` (${fl.sel.size})`;
    else if (fl?.type === 'text') cv = `: “${fl.q}”`;

    out.push(`<button class="chip ${fl ? 'on' : ''}" data-chip="${esc(fd.key)}">${esc(fd.key)}<span class="cv">${esc(cv)}</span>${CHIP_SVG}</button>`);

  $('#chips').innerHTML = out.join('');
}
$('#chips').addEventListener('click', e => {

function listPop(anchor, title, items, isOn, onToggle, onAll, onNone) {

function openFieldFilter(anchor, fd) {
  const k = fd.key;
  if (fd.type === 'cat') {
    const base = analyzedFeats().filter(f => catVisible(f) && passes(f, k));
    const counts = new Map(); for (const f of base) { const v = catVal(f.properties[k]); counts.set(v, (counts.get(v) || 0) + 1); }
    const items = fd.order.map(v => ({key: v, label: v, n: counts.get(v) || 0, color: colorFor(k, v)}));
    const isOn = v => { const fl = S.filters.get(k); return !fl || fl.sel.has(v); };
    listPop(anchor, k, items, isOn, (v, on) => {
      let fl = S.filters.get(k);
      if (!fl) { fl = {type: 'cat', sel: new Set(fd.order)}; S.filters.set(k, fl); }
      on ? fl.sel.add(v) : fl.sel.delete(v);
      if (fl.sel.size === fd.order.length) S.filters.delete(k);
      refresh();
    }, () => { S.filters.delete(k); refresh(); }, () => { S.filters.set(k, {type: 'cat', sel: new Set()}); refresh(); });
    return;
  }
  const fl = S.filters.get(k) || {};
  let html;
  if (fd.type === 'num') {
    const vs = fd.order.map(parseNum).filter(n => !isNaN(n));
    html = `<div class="fl"><div class="ph" style="padding:0 0 6px">${esc(k)} (entre ${fmt(Math.min(...vs))} y ${fmt(Math.max(...vs))})</div>
      <div class="two"><div><label>Desde</label><input type="number" id="fmin" value="${fl.min ?? ''}"></div><div><label>Hasta</label><input type="number" id="fmax" value="${fl.max ?? ''}"></div></div>
      <div class="bt"><button id="fok">Aplicar</button><button id="fclr">Quitar filtro</button></div></div>`;
  } else if (fd.type === 'date') {
    const d2i = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : '';
    html = `<div class="fl"><div class="ph" style="padding:0 0 6px">${esc(k)}</div>
      <div class="two"><div><label>Desde</label><input type="date" id="fmin" value="${d2i(fl.from)}"></div><div><label>Hasta</label><input type="date" id="fmax" value="${d2i(fl.to)}"></div></div>
      <div class="bt"><button id="fok">Aplicar</button><button id="fclr">Quitar filtro</button></div></div>`;
  } else {
    html = `<div class="fl"><div class="ph" style="padding:0 0 6px">${esc(k)} contiene…</div>
      <input type="text" id="fmin" value="${esc(fl.q || '')}" placeholder="Texto a buscar">
      <div class="bt"><button id="fok">Aplicar</button><button id="fclr">Quitar filtro</button></div></div>`;
  }
  openPop(anchor, html, p => {
    const a = p.querySelector('#fmin'), b = p.querySelector('#fmax');
    const ok = () => {
      if (fd.type === 'num') {
        const mn = a.value === '' ? null : +a.value, mx = b.value === '' ? null : +b.value;
        mn == null && mx == null ? S.filters.delete(k) : S.filters.set(k, {type: 'num', min: mn, max: mx});
      } else if (fd.type === 'date') {
        const fr = a.value ? new Date(a.value + 'T00:00') : null, to = b.value ? new Date(b.value + 'T23:59:59') : null;
        !fr && !to ? S.filters.delete(k) : S.filters.set(k, {type: 'date', from: fr, to});
      } else {
        a.value.trim() ? S.filters.set(k, {type: 'text', q: a.value.trim()}) : S.filters.delete(k);
      }
      closePop(); refresh();
    };
    p.querySelector('#fok').onclick = ok;
    p.querySelector('#fclr').onclick = () => { S.filters.delete(k); closePop(); refresh(); };
    p.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
    setTimeout(() => a.isConnected && a.focus(), 0);
  });
}
function openLayersFilter(anchor) {
  const items = S.layers.map(l => ({key: String(l.id), label: l.name, n: l.features.length, color: l.style.color}));
  const upd = () => { computeFields(); renderPanel(); refresh(); };
  listPop(anchor, 'Capas incluidas en las estadísticas', items, id => layerById(id).analyzed,
    (id, on) => { layerById(id).analyzed = on; upd(); },
    () => { S.layers.forEach(l => l.analyzed = true); upd(); },

}
function openZoneFilter(anchor) {
  const cnt = new Map(); for (const f of analyzedFeats()) if (catVisible(f) && passes(f, '__zone')) for (const z of f.zones || []) cnt.set(z, (cnt.get(z) || 0) + 1);
  const items = S.zones.map(z => ({key: String(z.id), label: `${z.name}`, n: cnt.get(z.id) || 0})).sort((a, b) => a.label.localeCompare(b.label, 'es', {numeric: true}));
  listPop(anchor, 'Registros dentro de las zonas', items, id => S.zoneSel.has(+id),
    (id, on) => { on ? S.zoneSel.add(+id) : S.zoneSel.delete(+id); refresh(); },
    () => { S.zones.forEach(z => S.zoneSel.add(z.id)); refresh(); },
    () => { S.zoneSel.clear(); refresh(); });
}

  for (const f of fs) lines.push([f.ly.name, f.properties.name || '', f.rep ? f.rep[1] : '', f.rep ? f.rep[0] : '',
    (f.zones || []).map(z => S.zoneById.get(z)?.name).join(' | '), ...cols.map(c => f.properties[c])].map(q).join(';'));

$('#kmlBtn').onclick = () => {
  const fs = filteredFeats(); if (!fs.length) return toast('No hay registros para exportar');

function kmlColor(hex, a = 1) { const h = hex.replace('#', ''); return Math.round(a * 255).toString(16).padStart(2, '0') + h.slice(4, 6) + h.slice(2, 4) + h.slice(0, 2); }
function geomKml(g) {
  const c = a => a.map(p => p[0] + ',' + p[1]).join(' ');
  switch (g.type) {
    case 'Point': return `<Point><coordinates>${g.coordinates[0]},${g.coordinates[1]}</coordinates></Point>`;
    case 'LineString': return `<LineString><tessellate>1</tessellate><coordinates>${c(g.coordinates)}</coordinates></LineString>`;
    case 'Polygon': return `<Polygon>${g.coordinates.map((r, i) => { const t = i ? 'innerBoundaryIs' : 'outerBoundaryIs'; return `<${t}><LinearRing><coordinates>${c(r)}</coordinates></LinearRing></${t}>`; }).join('')}</Polygon>`;
    case 'MultiPoint': case 'MultiLineString': case 'MultiPolygon':
      return `<MultiGeometry>${g.coordinates.map(cc => geomKml({type: g.type.slice(5), coordinates: cc})).join('')}</MultiGeometry>`;
    case 'GeometryCollection': return `<MultiGeometry>${g.geometries.map(geomKml).join('')}</MultiGeometry>`;
  }
  return '';
}
function buildKml(fs, title) {
  const x = s => esc(s);
  const styles = new Map();
  const byLayer = new Map();
  for (const f of fs) { if (!byLayer.has(f.ly)) byLayer.set(f.ly, []); byLayer.get(f.ly).push(f); }
  const folders = [...byLayer.entries()].map(([ly, arr]) => `<Folder><name>${x(ly.name)}</name>` + arr.map(f => {
    const ps = pathStyle(f), col = ps.color;
    const sid = 's' + [col, ps.fillColor, ps.fillOpacity, ps.weight].join('_').replace(/[#.]/g, '');
    if (!styles.has(sid)) styles.set(sid, `<Style id="${sid}"><IconStyle><color>${kmlColor(col)}</color><scale>1</scale><Icon><href>https://www.gstatic.com/mapspro/images/stock/503-wht-blank_maps.png</href></Icon></IconStyle><LineStyle><color>${kmlColor(col)}</color><width>${ps.weight}</width></LineStyle><PolyStyle><color>${kmlColor(ps.fillColor, ps.fillOpacity || .3)}</color></PolyStyle></Style>`);
    const p = f.properties;
    const data = Object.keys(p).filter(k => !STYLE_KEYS.has(k)).map(k => `<Data name="${x(k)}"><value>${x(p[k])}</value></Data>`).join('');
    return `<Placemark><name>${x(p.name || '')}</name><styleUrl>#${sid}</styleUrl><ExtendedData>${data}</ExtendedData>${geomKml(f.geometry)}</Placemark>`;
  }).join('') + '</Folder>').join('');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${x(title || 'Exportación')}</name>${[...styles.values()].join('')}${folders}</Document></kml>`;
}

/* ---------- buscador ---------- */
async function doSearch() {
  const q = $('#searchIn').value.trim(), box = $('#searchRes');
  if (!q) { box.style.display = 'none'; return; }
  const nq = norm(q), res = [];
  for (const f of S.feats) {
    const p = f.properties;
    if (norm(p.name).includes(nq) || Object.keys(p).some(k => !STYLE_KEYS.has(k) && norm(p[k]).includes(nq))) { res.push(f); if (res.length >= 12) break; }
  }
  const render = geo => {
    let h = '';
    if (res.length) h += `<div class="sh">En las capas</div>` + res.map(f => {
      const hit = f.properties.name || Object.keys(f.properties).map(k => !STYLE_KEYS.has(k) && norm(f.properties[k]).includes(nq) ? `${k}: ${f.properties[k]}` : null).find(Boolean);
      return `<div class="si" data-f="${f.id}">${esc(String(hit).slice(0, 70))}<small>${esc(f.ly.name)}</small></div>`;
    }).join('');
    if (geo && geo.length) h += `<div class="sh">Direcciones</div>` + geo.map((g, i) => `<div class="si" data-g="${i}">${esc(g.display_name.split(',').slice(0, 3).join(','))}<small>${esc(g.type || '')}</small></div>`).join('');
    if (!h) h = geo ? '<div class="si" style="cursor:default;color:#5f6368">Sin resultados</div>' : '<div class="si" style="cursor:default;color:#5f6368">Buscando dirección…</div>';
    box.innerHTML = h; box.style.display = 'block';
    box.onclick = e => {
      const it = e.target.closest('.si'); if (!it) return;
      if (it.dataset.f) { const f = S.feats.find(x => x.id === +it.dataset.f); if (f) focusFeature(f); }
      else if (it.dataset.g != null && geo) { const g = geo[+it.dataset.g]; map.setView([+g.lat, +g.lon], 17); L.popup().setLatLng([+g.lat, +g.lon]).setContent(esc(g.display_name)).openOn(map); }
      box.style.display = 'none';
    };
  };
  render(null);
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=ar&accept-language=es&q=${encodeURIComponent(q)}`);
    render(await r.json());
  } catch { render([]); }
}
$('#searchBtn').onclick = doSearch;
$('#searchIn').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
document.addEventListener('mousedown', e => { if (!$('#search').contains(e.target)) $('#searchRes').style.display = 'none'; });

/* ---------- carga de archivos ---------- */
$('#addBtn').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = e => { loadFiles(e.target.files); e.target.value = ''; };
$('#fitAllBtn').onclick = () => fitLayers(S.layers.filter(l => l.visible));
$('#collapseBtn').onclick = () => { $('#panel').classList.toggle('collapsed'); $('#collapseBtn').style.transform = $('#panel').classList.contains('collapsed') ? 'rotate(180deg)' : ''; };
let dragN = 0;
addEventListener('dragenter', e => { if (e.dataTransfer?.types?.includes('Files')) { dragN++; document.body.classList.add('dropping'); } });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; document.body.classList.remove('dropping'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; document.body.classList.remove('dropping'); if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });
addEventListener('resize', () => { if (dashOpen) map.invalidateSize({pan: false}); });

// celular: el selector de archivos sin filtro de tipo (Android oculta los .kml si se filtra) y dashboard más alto
if (matchMedia('(pointer:coarse)').matches) $('#fileIn').removeAttribute('accept');
if (innerWidth <= 760) document.documentElement.style.setProperty('--dashH', '62vh');
$('#mapTitle').addEventListener('input', scheduleSave);
$('#baseSel').addEventListener('change', scheduleSave);
$('#newMapBtn').onclick = newMap;
navigator.storage?.persist?.().catch(() => {});
renderPanel(); renderSub();
restoreProject().finally(() => { restoring = false; });
</script>
</body>
</html>
